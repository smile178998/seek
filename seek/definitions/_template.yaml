# ============================================================
# 规则模板：复制本文件并改名即可新增一个检测模块
# 把 enabled 改成 true 后才会被加载
# ============================================================
name: example_site           # 唯一标识，只能用字母数字下划线
title: 示例站点              # 界面上显示的名字
category: social             # 分组：social / shop / dev / profile / breach / domain / other
homepage: https://example.com
description: 一句话说明这个模块查的是什么
notes: 备注，例如接口限制、误报可能性
enabled: false
requires: []                 # 需要的配置项名，如 [SOME_API_KEY]，缺失时该模块自动跳过

# ---------- 可选：预备请求（多步）----------
# 很多站点要先 GET 一个页面拿 CSRF token / cookie，再带着它去查重。
# prepare 里的请求会按顺序执行，cookie 由同一会话自动携带到后续请求。
# save 把值存进模板上下文，供下面的 request 用 {变量名} 引用。
prepare:
  - method: GET
    url: "https://example.com/signup"
    save:
      csrf:                          # 之后可用 {csrf}
        from: cookie                 # cookie / header / json / body_regex
        name: csrftoken              # cookie / header 用 name
        required: true               # 取不到就判为 error（false 则用 default 兜底）
      build_id:
        from: body_regex             # 用正则从 HTML/JS 里抠值
        pattern: "buildId\":\"(.*?)\""
        group: 1
        required: false
        default: ""
      api_token:
        from: json                   # 从 JSON 响应里按路径取值
        path: "data.token"
        required: false

# ---------- 请求定义 ----------
request:
  method: POST               # GET / POST / PUT ...
  url: "https://example.com/api/account/exists"
  # 可用变量：
  #   {email} {email_lower} {email_urlenc}
  #   {email_md5} {email_sha1} {email_sha256}
  #   {local} {local_urlenc} {domain}
  #   {nonce} {random_password}
  #   {env.KEY}  ← 来自 .env 或环境变量，需在 requires 中声明
  params:
    lang: "zh"
  headers:
    Content-Type: "application/json"
    Accept: "application/json"
  json:                      # json 与 data 二选一；data 为表单编码
    email: "{email}"
  follow_redirects: true
  # data:
  #   email: "{email}"

# ---------- 判定规则 ----------
# 自上而下匹配，命中第一条即返回。
# 一条规则内的所有子句必须同时成立（AND）。
# 可用的动作：registered_if / not_registered_if / info_if / rate_limited_if / error_if
rules:
  - registered_if:
      status_in: [200]                       # HTTP 状态码在列表中
      json_path_equals:                      # JSON 路径取值等于某个值
        path: "data.exists"
        value: true
    detail: 该邮箱已在示例站点注册

  - not_registered_if:
      status_in: [200, 404]
      body_contains: ["not found"]           # 响应体包含全部这些字符串
    detail: 未注册

  - rate_limited_if:
      status_in: [429]

  - error_if:
      status_in: [403]
    detail: 被风控拦截，换出口 IP 后重试

# 所有规则都没命中时的兜底状态：unknown / error
default: unknown
default_detail: 响应格式与规则不匹配，可能站点已改版

# ---------- 可选：从响应里提取附加信息 ----------
# 字段名: JSON 路径（支持数字下标与 [] 通配）
extract:
  masked_phone: "data.maskedPhone"
  linked_accounts: "data.accounts[].name"

# ============================================================
# 全部可用的判定子句
# ------------------------------------------------------------
#   status_in: [200, 302]              状态码属于列表
#   status_eq: 200                     状态码等于
#   body_contains: ["a", "b"]          响应体同时包含 a 和 b
#   body_not_contains: ["error"]       响应体不包含任何一项
#   body_matches: "user\\s+exists"      正则匹配（忽略大小写、跨行）
#   json_path_exists: "data.id"        JSON 路径存在且非 null
#   json_path_truthy: "data.exists"    JSON 路径取值为真
#   json_path_equals: {path: ..., value: ...}
#   header_contains: {name: Location, value: "/login"}
# ============================================================
