name: bitbucket
title: Bitbucket
category: dev
homepage: https://bitbucket.org
description: Public login page probe
notes: Candidate rule; endpoint behavior may change.

request:
  method: GET
  url: "https://bitbucket.org/account/signin/"
  headers:
    Accept: "text/html"

rules:
  - rate_limited_if:
      status_in: [403, 429]

default: unknown