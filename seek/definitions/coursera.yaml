name: coursera
title: Coursera
category: edu
homepage: https://www.coursera.org
description: Public login page probe
notes: Candidate rule; endpoint behavior may change.

request:
  method: GET
  url: "https://www.coursera.org/?authMode=login"
  headers:
    Accept: "text/html"

rules:
  - rate_limited_if:
      status_in: [403, 429]

default: unknown