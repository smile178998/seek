name: devrant
title: DevRant
category: dev
homepage: https://devrant.com
description: 注册 API 返回邮箱占用错误信息
notes: 端点可能随站点改版失效；仅限本人或已授权目标

request:
  method: POST
  url: "https://devrant.com/api/users"
  headers:
    Content-Type: "application/x-www-form-urlencoded"
    X-Requested-With: "XMLHttpRequest"
  data:
    app: "3"
    type: "1"
    email: "{email}"
    username: ""
    password: ""
    guid: ""
    plat: "3"
    sid: ""
    seid: ""

rules:
  - registered_if:
      body_contains: ["already registered to an account"]
    detail: 邮箱已注册
  - not_registered_if:
      status_in: ["200", "400"]
  - rate_limited_if:
      status_in: ["429", "403"]

default: unknown
