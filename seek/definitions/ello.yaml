name: ello
title: Ello
category: social
homepage: https://ello.co
description: 注册邮箱校验
notes: 端点可能随站点改版失效；仅限本人或已授权目标

request:
  method: POST
  url: "https://ello.co/api/v2/email_available"
  headers:
    Content-Type: "application/json"
  json:
    email: "{email}"

rules:
  - registered_if:
      json_path_equals:
        path: "available"
        value: false
  - not_registered_if:
      json_path_equals:
        path: "available"
        value: true
  - rate_limited_if:
      status_in: ["429", "403"]

default: unknown
