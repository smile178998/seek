name: eventbrite
title: Eventbrite
category: other
homepage: https://www.eventbrite.com
description: 注册邮箱可用性
notes: 端点可能随站点改版失效；仅限本人或已授权目标

request:
  method: GET
  url: "https://www.eventbrite.com/api/v3/users/email_available/"
  params:
    email: "{email}"
  headers:
    Accept: "application/json"

rules:
  - registered_if:
      json_path_equals:
        path: "available"
        value: false
  - not_registered_if:
      json_path_equals:
        path: "available"
        value: true
  - rate_limited_if:
      status_in: ["429", "403"]

default: unknown
