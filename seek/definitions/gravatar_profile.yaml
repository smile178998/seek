name: gravatar_profile
title: Gravatar 公开资料
category: profile
homepage: https://gravatar.com
description: Gravatar 官方公开资料 JSON 接口，可拿到用户名、昵称、站点等公开信息
notes: 该接口由 Gravatar 官方提供给公众查询，未登录时有频率限制

request:
  method: GET
  url: "https://www.gravatar.com/{email_sha256}.json"
  headers:
    Accept: "application/json"
  follow_redirects: true

rules:
  - registered_if:
      status_in: [200]
      json_path_exists: "entry.0.hash"
    detail: 存在公开的 Gravatar 资料
  - not_registered_if:
      status_in: [404]
    detail: 没有公开的 Gravatar 资料
  - rate_limited_if:
      status_in: [429]

extract:
  username: "entry.0.preferredUsername"
  display_name: "entry.0.displayName"
  profile_url: "entry.0.profileUrl"
  avatar_url: "entry.0.thumbnailUrl"
  location: "entry.0.currentLocation"
  accounts: "entry.0.accounts[].shortname"
  urls: "entry.0.urls[].value"

default: unknown
