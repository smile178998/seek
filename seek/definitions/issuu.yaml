name: issuu
title: Issuu
category: media
homepage: https://issuu.com
description: 注册邮箱校验
notes: 端点可能随站点改版失效；仅限本人或已授权目标

request:
  method: POST
  url: "https://issuu.com/signup/check_email"
  headers:
    Content-Type: "application/x-www-form-urlencoded"
  data:
    email: "{email}"

rules:
  - registered_if:
      body_contains: ["already", "taken", "exists"]
    detail: 邮箱已占用
  - not_registered_if:
      status_in: ["200", "400"]
  - rate_limited_if:
      status_in: ["429", "403"]

default: unknown
