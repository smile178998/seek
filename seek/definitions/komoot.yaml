name: komoot
title: Komoot
category: sport
homepage: https://www.komoot.com
description: 注册邮箱校验
notes: 端点可能随站点改版失效；仅限本人或已授权目标

request:
  method: POST
  url: "https://account.komoot.com/v1/signup"
  headers:
    Content-Type: "application/json"
  json:
    email: "{email}"
    password: "{random_password}"

rules:
  - registered_if:
      body_contains: ["already", "taken", "exists"]
    detail: 邮箱已占用
  - not_registered_if:
      status_in: ["200", "400"]
  - rate_limited_if:
      status_in: ["429", "403"]

default: unknown
