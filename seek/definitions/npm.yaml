name: npm
title: npm
category: dev
homepage: https://www.npmjs.com
description: Public login page probe
notes: Candidate rule; endpoint behavior may change.

request:
  method: GET
  url: "https://www.npmjs.com/login"
  headers:
    Accept: "text/html"

rules:
  - rate_limited_if:
      status_in: [403, 429]

default: unknown