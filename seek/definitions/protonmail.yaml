name: protonmail
title: Proton Mail
category: mail
homepage: https://proton.me
description: Proton 公开 PKS 索引查询（info:1:1=存在）
notes: 端点可能随站点改版失效；仅限本人或已授权目标

request:
  method: GET
  url: "https://api.protonmail.ch/pks/lookup"
  params:
    op: "index"
    search: "{email}"

rules:
  - registered_if:
      body_contains: ["info:1:1"]
    detail: 该邮箱在 Proton 有密钥记录
  - not_registered_if:
      body_contains: ["info:1:0"]
    detail: 未找到 Proton 密钥
  - rate_limited_if:
      status_in: ["429", "403"]

default: unknown
