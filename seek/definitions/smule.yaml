name: smule
title: Smule
category: music
homepage: https://www.smule.com
description: 注册邮箱校验
notes: 端点可能随站点改版失效；仅限本人或已授权目标

request:
  method: POST
  url: "https://www.smule.com/a/account/email/check"
  headers:
    Content-Type: "application/x-www-form-urlencoded"
  data:
    email: "{email}"

rules:
  - registered_if:
      body_contains: ["already", "taken", "exists"]
    detail: 邮箱已占用
  - not_registered_if:
      status_in: ["200", "400"]
  - rate_limited_if:
      status_in: ["429", "403"]

default: unknown
