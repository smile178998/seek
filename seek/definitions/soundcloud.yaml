name: soundcloud
title: SoundCloud
category: music
homepage: https://soundcloud.com
description: Public login page probe
notes: Candidate rule; endpoint behavior may change.

request:
  method: GET
  url: "https://soundcloud.com/signin"
  headers:
    Accept: "text/html"

rules:
  - rate_limited_if:
      status_in: [403, 429]

default: unknown