name: spotify
title: Spotify
category: social
homepage: https://www.spotify.com
description: 调用 Spotify 注册页前端使用的邮箱校验接口判断是否已注册
notes: >
  这是 Spotify 注册页自身用于实时校验的公开接口。若接口改版，结果会显示为
  「无法判定」。请仅对本人邮箱或已授权目标使用。

request:
  method: GET
  url: "https://spclient.wg.spotify.com/signup/public/v1/account"
  params:
    validate: "1"
    email: "{email}"
  headers:
    Accept: "application/json"

rules:
  - registered_if:
      json_path_equals: { path: "status", value: 20 }
    detail: 该邮箱已注册 Spotify
  - not_registered_if:
      json_path_equals: { path: "status", value: 1 }
    detail: 未在 Spotify 注册
  - rate_limited_if:
      status_in: [429]
  # 部分地区（含 CN）统一返回 120，无法据此判定注册状态
  - unknown_if:
      json_path_equals: { path: "status", value: 120 }
    detail: Spotify 接口在当前地区不可用（status=120），无法判定

default: unknown
default_detail: 接口返回格式与规则不匹配，可能已改版
