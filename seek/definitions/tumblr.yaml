name: tumblr
title: Tumblr
category: social
homepage: https://www.tumblr.com
description: 注册 account/validate 邮箱校验
notes: 端点可能随站点改版失效；仅限本人或已授权目标

prepare:
  - method: GET
    url: "https://www.tumblr.com/"

request:
  method: POST
  url: "https://www.tumblr.com/api/v2/register/account/validate"
  headers:
    Content-Type: "application/json"
  json:
    email: "{email}"

rules:
  - registered_if:
      body_contains: ["already", "taken", "exists"]
    detail: 邮箱已占用
  - not_registered_if:
      status_in: ["200", "400"]
  - rate_limited_if:
      status_in: ["429", "403"]

default: unknown
