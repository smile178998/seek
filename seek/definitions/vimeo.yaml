name: vimeo
title: Vimeo
category: media
homepage: https://vimeo.com
description: Public login page probe
notes: Candidate rule; endpoint behavior may change.

request:
  method: GET
  url: "https://vimeo.com/log_in"
  headers:
    Accept: "text/html"

rules:
  - rate_limited_if:
      status_in: [403, 429]

default: unknown