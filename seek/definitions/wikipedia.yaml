name: wikipedia
title: Wikipedia
category: other
homepage: https://www.wikipedia.org
description: Public login page probe
notes: Candidate rule; endpoint behavior may change.

request:
  method: GET
  url: "https://www.wikipedia.org/w/index.php?title=Special:UserLogin"
  headers:
    Accept: "text/html"

rules:
  - rate_limited_if:
      status_in: [403, 429]

default: unknown