name: wordpress
title: WordPress.com
category: dev
homepage: https://wordpress.com
description: 注册邮箱校验接口
notes: 端点可能随站点改版失效；仅限本人或已授权目标

request:
  method: POST
  url: "https://public-api.wordpress.com/rest/v1.1/users/validate"
  headers:
    Content-Type: "application/json"
  json:
    email: "{email}"

rules:
  - registered_if:
      body_contains: ["already", "taken", "exists"]
    detail: 邮箱已占用
  - not_registered_if:
      status_in: ["200", "400"]
  - rate_limited_if:
      status_in: ["429", "403"]

default: unknown
